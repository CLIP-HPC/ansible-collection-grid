---
name: CI
on:
  # Run CI against all pushes (direct commits, also merged PRs), Pull Requests
  push:
  pull_request:
  # schedule:
  #   - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ci:
    uses: vbc-it/github-action-workflows/.github/workflows/ansible-collection.yml@push_to_aap
    secrets:
      automationhub_token: ${{ secrets.AAP_HUB_API_TOKEN }}
    with:
      platform: self-hosted
      molecule_env_file: ansible.env
      publish_to_automationhub: true
      automationhub_url: https://tower.vbc.ac.at/api/galaxy/
